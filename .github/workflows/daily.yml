name: Daily 10 Random LeetCode Java Solvers

on:
  schedule:
    # Runs daily at 14:30 UTC (20:00 IST)
    - cron: "30 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solve-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate 10 random Java solutions
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Google recommends newer models for new projects; Gemini 2.5 access is limited.
          GEMINI_MODEL: gemini-3.8-flash
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
        run: python agent.py

      - name: Upload solution artifact
        uses: actions/upload-artifact@v4
        with:
          name: leetcode-java-10-random-solutions
          path: output/*.md
          if-no-files-found: error
          retention-days: 30
