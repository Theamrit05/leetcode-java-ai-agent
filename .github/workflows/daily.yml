name: Daily LeetCode Java Solver

on:
  schedule:
    # Runs daily at 00:30 UTC (06:00 IST)
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solve-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate today's Java solution
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
        run: |
          python agent.py

      - name: Upload solution artifact
        uses: actions/upload-artifact@v4
        with:
          name: leetcode-java-daily-solution
          path: output/*.md
          if-no-files-found: error
          retention-days: 30
