name: Daily 10 Random LeetCode Java Solvers

on:
  schedule:
    # Runs daily at 14:30 UTC (20:00 IST)
    - cron: "30 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Prevent overlapping scheduled/manual runs from competing for the same LeetCode session.
concurrency:
  group: daily-leetcode-java-agent
  cancel-in-progress: false

jobs:
  solve-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate 10 random Java solutions
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_MODEL: gpt-oss:120b
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          SUBMIT_TO_LEETCODE: "true"
          PYTHONUNBUFFERED: "1"
        run: python -u agent.py

      - name: Upload solution artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leetcode-java-10-random-solutions
          path: output/*.md
          if-no-files-found: error
          retention-days: 30
